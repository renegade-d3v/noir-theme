# Noir — minimal dark theme for iPod Video / Classic (320x240)
# Playback screen and menus after iPod reFresh Three by Ciprian Dragu (CC-BY-SA 3.0)
wps: /.rockbox/wps/Noir.wps
sbs: /.rockbox/wps/Noir.sbs
fms: -
font: /.rockbox/fonts/20-SF-Pro-Rounded-Semibold.fnt
backdrop: -
statusbar: off
ui viewport: -
foreground color: FFFFFF
background color: 1E1C1A
selector type: bar (color)
line selector start color: 39FF88
line selector text color: 1E1C1A
# menus are a skinned list (%Lb in Noir.sbs) without icons
show icons: off
iconset: -
viewers iconset: -
scrollbar: off
list separator height: 0
filetype colours: -
volume display: numeric
battery display: numeric
